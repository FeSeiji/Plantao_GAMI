# Nome fixo: sem ele o Compose deriva "planto" da pasta "Plantão" e não reconhece o container existente
name: plantao
version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: plantao-backend
    ports:
      - "3000:3000"
    # .env aponta para o Supabase local; ENV_FILE=.env.producao docker-compose up usa a produção
    env_file:
      - ./Backend/${ENV_FILE:-.env}
    environment:
      - NODE_ENV=development
    volumes:
      - ./Backend/src:/app/src
      - ./Backend/node_modules:/app/node_modules
    working_dir: /app
    command: npm run dev
